server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cesium отдаёт .wasm; на старых mime.types его может не быть
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/octet-stream;

    client_max_body_size 32m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Проксирование на FastAPI. Адрес резолвится в рантайме через DNS Docker,
    # поэтому nginx стартует даже если контейнер backend ещё не поднят.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # расчёты бывают долгими
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering off;
    }

    # Хэшированные ассеты Vite можно кэшировать навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
