# Запуск из корня проекта:
#   docker compose -f deploy/docker-compose.yml up --build
# Фронтенд будет на http://localhost:${FRONTEND_PORT:-8080}
#
# Пути context указаны относительно этого файла (папки deploy/).

name: cosmo-constellation

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: cosmo-constellation/frontend:latest
    container_name: cosmo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - cosmo
    # Раскомментировать, когда появится сервис backend:
    # depends_on:
    #   backend:
    #     condition: service_healthy

  # ------------------------------------------------------------------
