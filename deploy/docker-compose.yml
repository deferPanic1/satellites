# Запуск из корня проекта:
#   docker compose -f deploy/docker-compose.yml up --build
# Фронтенд будет на http://localhost:${FRONTEND_PORT:-8080}
#
# Пути context указаны относительно этого файла (папки deploy/).

name: cosmo-constellation

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: cosmo-constellation/frontend:latest
    container_name: cosmo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - cosmo
    depends_on:
      backend:
        condition: service_healthy

  # nginx во фронтенде проксирует /api/ на http://backend:8000 и резолвит
  # адрес в рантайме, поэтому стартует даже если бэкенд ещё поднимается.
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: cosmo-constellation/backend:latest
    container_name: cosmo-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - COSMO_DATA_DIR=/app/data
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Встроенные сценарии кейса — сервер отдаёт их по /api/scenarios
      - ../case/Данные:/app/data:ro
    networks:
      - cosmo
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  cosmo:
    driver: bridge
